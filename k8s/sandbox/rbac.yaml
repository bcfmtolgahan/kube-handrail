# Bound to the kubernetes_groups of the two EKS access entries (mcp/CONTRACT.md, Identity).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-handrail-reader
  namespace: kube-handrail-sandbox
  labels:
    app.kubernetes.io/part-of: kube-handrail-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  # Impact preview of plan_scale_deployment. No pods: ready counts come from the
  # Deployment status and EndpointSlices.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-handrail-reader
  namespace: kube-handrail-sandbox
  labels:
    app.kubernetes.io/part-of: kube-handrail-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-handrail-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kube-handrail-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-handrail-writer
  namespace: kube-handrail-sandbox
  labels:
    app.kubernetes.io/part-of: kube-handrail-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-handrail-writer
  namespace: kube-handrail-sandbox
  labels:
    app.kubernetes.io/part-of: kube-handrail-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-handrail-writer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kube-handrail-writer
