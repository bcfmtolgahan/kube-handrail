# Sandbox target for the scale tools. It must stay free of GitOps markers
# (app.kubernetes.io/instance label, Argo CD tracking-id annotation) and HPAs,
# otherwise plan_scale_deployment refuses it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kube-handrail-sandbox
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kube-handrail-sandbox
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: kube-handrail-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: kube-handrail-sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
