# Rendered by Terraform (terraform/modules/namespace-policy); do not edit.
# The read Lambda compares the admission policy with its own bounds on every plan
# (mcp/CONTRACT.md, Admission policy). Both objects are cluster-scoped, so this is the
# reader's only cluster-scoped permission: get, on these two names only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-handrail-policy-reader
  labels:
    app.kubernetes.io/part-of: kube-handrail
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies"]
    resourceNames: ["kube-handrail-writer-bounds"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicybindings"]
    resourceNames: ["kube-handrail-writer-bounds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-handrail-policy-reader
  labels:
    app.kubernetes.io/part-of: kube-handrail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-handrail-policy-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kube-handrail-reader
