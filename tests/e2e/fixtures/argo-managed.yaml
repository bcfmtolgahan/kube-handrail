# Zero-replica Deployment that looks Argo CD-managed. Used by the e2e test to
# check that planning is refused for GitOps-managed objects. It runs no pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-managed
  namespace: kube-handrail-sandbox
  labels:
    app.kubernetes.io/part-of: kube-handrail-sandbox
  annotations:
    argocd.argoproj.io/tracking-id: "e2e:apps/Deployment:kube-handrail-sandbox/argo-managed"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: argo-managed
  template:
    metadata:
      labels:
        app: argo-managed
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
